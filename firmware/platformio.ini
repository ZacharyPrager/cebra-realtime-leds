; PlatformIO project for the ESP32 (VS Code + PlatformIO extension).
; Open this "firmware" folder in VS Code, then Upload (→ arrow in the bottom bar).
[platformio]
src_dir = cebra_leds

[env:esp32dev]
platform = espressif32@8.0.0  ; version this was tested with
board = esp32dev
framework = arduino
monitor_speed = 115200
